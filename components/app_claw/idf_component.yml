dependencies:
  fatfish_runtime:
    path: ../fatfish_runtime

  claw_hw_registry:
    path: ../../third-party/esp-claw/components/common/claw_hw_registry

  audio_hub:
    path: ../../third-party/esp-claw/components/common/audio_hub

  cap_boards:
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_boards

  cap_files:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_FILES} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_files

  cap_agent_mgr:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_AGENT_MGR} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_agent_mgr

  cap_im_platform:
    rules:
      - if: >-
          $CONFIG{APP_CLAW_CAP_IM_FEISHU} == True || $CONFIG{APP_CLAW_CAP_IM_QQ} == True ||
          $CONFIG{APP_CLAW_CAP_IM_TG} == True || $CONFIG{APP_CLAW_CAP_IM_WECHAT} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_im_platform

  cap_im_local:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_IM_LOCAL} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_im_local

  cap_llm_inspect:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LLM_INSPECT} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_llm_inspect

  cap_llm_config:
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_llm_config

  cap_lua:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_lua

  cap_mcp_client:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MCP_CLIENT} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_mcp_client

  mcp_mdns:
    rules:
      - if: >-
          $CONFIG{APP_CLAW_CAP_MCP_CLIENT} == True ||
          $CONFIG{APP_CLAW_CAP_MCP_SERVER} == True
    path: ../../third-party/esp-claw/components/common/mcp_mdns

  cap_mcp_server:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MCP_SERVER} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_mcp_server

  cap_router_mgr:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_ROUTER_MGR} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_router_mgr

  cap_scheduler:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_SCHEDULER} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_scheduler

  cap_session_mgr:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_SESSION_MGR} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_session_mgr

  cap_skill_mgr:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_SKILL_MGR} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_skill_mgr

  cap_system:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_SYSTEM} == True
    path: ../cap_system

  cap_http_request:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_HTTP_REQUEST} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_http_request

  cap_web_search:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_WEB_SEARCH} == True
    path: ../../third-party/esp-claw/components/claw_capabilities/cap_web_search

  claw_cap:
    path: ../../third-party/esp-claw/components/claw_modules/claw_cap

  claw_core:
    path: ../../third-party/esp-claw/components/claw_modules/claw_core

  claw_event_router:
    path: ../../third-party/esp-claw/components/claw_modules/claw_event_router

  claw_manager:
    path: ../../third-party/esp-claw/components/claw_modules/claw_manager

  claw_memory:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MEMORY} == True
    path: ../../third-party/esp-claw/components/claw_modules/claw_memory

  claw_skill:
    path: ../../third-party/esp-claw/components/claw_modules/claw_skill

  claw_utils:
    path: ../../third-party/esp-claw/components/claw_modules/claw_utils

  skill_builder:
    path: ../../third-party/esp-claw/components/common/skill_builder

  lua_module_builder:
    path: ../../third-party/esp-claw/components/common/lua_module_builder

  system_ui:
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True && $CONFIG{APP_CLAW_SYSTEM_UI_ENABLE} == True
    path: ../../third-party/esp-claw/components/common/system_ui
